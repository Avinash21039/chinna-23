<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Best Friends 🐼💗</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #ffd6e7,
        #fbc2eb,
        #c6e6ff,
        #ffe6f0
    );

    background-size: 400% 400%;
    animation: backgroundMove 10s ease infinite;
}


/* Background */

@keyframes backgroundMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}


/* Main */

.container {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    position: relative;
}


/* Heading */

.title {
    margin-top: 70px;

    color: #ffffff;
    font-size: 38px;
    font-weight: bold;

    text-shadow:
        0 4px 15px rgba(0,0,0,.2);

    animation: titleAppear 1.5s ease;
}

.subtitle {
    margin-top: 10px;

    color: white;
    font-size: 17px;

    animation: subtitleAppear 2s ease;
}

@keyframes titleAppear {

    from {
        opacity: 0;
        transform: translateY(-40px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes subtitleAppear {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* Panda area */

.panda-area {
    position: relative;

    width: 100%;
    max-width: 900px;

    height: 330px;

    margin-top: 35px;
}


/* Panda */

.panda {
    position: absolute;

    font-size: 115px;

    bottom: 40px;

    z-index: 5;
}


/* Left panda */

.panda-left {

    left: -150px;

    animation:
        runLeft 3s ease-in-out forwards,
        pandaBounce .5s ease-in-out 3s infinite;
}


/* Right panda */

.panda-right {

    right: -150px;

    animation:
        runRight 3s ease-in-out forwards,
        pandaBounce .5s ease-in-out 3s infinite;
}


/* Running */

@keyframes runLeft {

    0% {
        left: -150px;
        transform: rotate(-15deg);
    }

    20% {
        transform: rotate(10deg);
    }

    40% {
        transform: rotate(-10deg);
    }

    60% {
        transform: rotate(8deg);
    }

    80% {
        transform: rotate(-5deg);
    }

    100% {
        left: calc(50% - 115px);
        transform: rotate(0);
    }
}


@keyframes runRight {

    0% {
        right: -150px;
        transform: scaleX(-1) rotate(-15deg);
    }

    20% {
        transform: scaleX(-1) rotate(10deg);
    }

    40% {
        transform: scaleX(-1) rotate(-10deg);
    }

    60% {
        transform: scaleX(-1) rotate(8deg);
    }

    80% {
        transform: scaleX(-1) rotate(-5deg);
    }

    100% {
        right: calc(50% - 115px);
        transform: scaleX(-1) rotate(0);
    }
}


/* Hug bounce */

@keyframes pandaBounce {

    0%,100% {
        bottom: 40px;
    }

    50% {
        bottom: 48px;
    }
}


/* Hug */

.hug-heart {

    position: absolute;

    left: 50%;
    top: 50px;

    transform: translateX(-50%) scale(0);

    font-size: 70px;

    opacity: 0;

    animation:
        heartAppear 1s ease forwards;

    animation-delay: 3s;

    z-index: 10;
}

@keyframes heartAppear {

    0% {
        transform: translateX(-50%) scale(0);
        opacity: 0;
    }

    60% {
        transform: translateX(-50%) scale(1.3);
        opacity: 1;
    }

    100% {
        transform: translateX(-50%) scale(1);
        opacity: 1;
    }
}


/* Sorry message */

.sorry {

    margin-top: -10px;

    color: #ff477e;

    font-size: 34px;
    font-weight: bold;

    opacity: 0;
    transform: scale(.5);

    animation: sorryAppear 1.5s ease forwards;

    animation-delay: 3.5s;

    text-shadow:
        0 4px 15px rgba(255,70,120,.25);
}

@keyframes sorryAppear {

    0% {
        opacity: 0;
        transform: scale(.5);
    }

    70% {
        transform: scale(1.15);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}


/* Message */

.message {

    margin-top: 12px;

    max-width: 500px;

    text-align: center;

    color: #555;

    font-size: 16px;
    line-height: 1.6;

    opacity: 0;

    animation: messageAppear 1.5s ease forwards;

    animation-delay: 4.2s;
}

@keyframes messageAppear {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* Button */

.msg-button {

    margin-top: 22px;

    padding: 14px 35px;

    border: none;
    border-radius: 30px;

    background: linear-gradient(
        135deg,
        #ff4f81,
        #ff758c
    );

    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(255,75,120,.35);

    opacity: 0;

    animation: buttonAppear 1s ease forwards;

    animation-delay: 5s;

    transition: .3s;
}

.msg-button:hover {

    transform: scale(1.08);

    box-shadow:
        0 15px 30px rgba(255,75,120,.5);
}

@keyframes buttonAppear {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* Floating hearts */

.heart {

    position: absolute;

    bottom: -40px;

    font-size: 25px;

    animation: floatingHeart linear infinite;

    pointer-events: none;
}

.heart:nth-child(1) {
    left: 5%;
    animation-duration: 8s;
}

.heart:nth-child(2) {
    left: 18%;
    animation-duration: 11s;
    animation-delay: 2s;
}

.heart:nth-child(3) {
    left: 35%;
    animation-duration: 9s;
    animation-delay: 1s;
}

.heart:nth-child(4) {
    left: 60%;
    animation-duration: 12s;
    animation-delay: 3s;
}

.heart:nth-child(5) {
    left: 80%;
    animation-duration: 10s;
    animation-delay: 1s;
}

.heart:nth-child(6) {
    left: 92%;
    animation-duration: 13s;
    animation-delay: 4s;
}

@keyframes floatingHeart {

    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    20% {
        opacity: .8;
    }

    100% {
        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;
    }
}


/* Mobile */

@media(max-width:600px) {

    .title {
        font-size: 30px;
        margin-top: 45px;
    }

    .subtitle {
        font-size: 14px;
    }

    .panda {
        font-size: 80px;
    }

    @keyframes runLeft {

        0% {
            left: -100px;
        }

        100% {
            left: calc(50% - 80px);
        }
    }

    @keyframes runRight {

        0% {
            right: -100px;
        }

        100% {
            right: calc(50% - 80px);
        }
    }

    .sorry {
        font-size: 28px;
    }

    .message {
        padding: 0 25px;
        font-size: 14px;
    }
}

</style>
</head>


<body>

<div class="container">


    <!-- Floating hearts -->

    <div class="heart">💗</div>
    <div class="heart">💕</div>
    <div class="heart">💖</div>
    <div class="heart">💞</div>
    <div class="heart">💓</div>
    <div class="heart">💝</div>


    <!-- Heading -->

    <h1 class="title">
        Two Besties 🐼🐼
    </h1>

    <p class="subtitle">
        No matter what happens... we always find our way back 💕
    </p>


    <!-- Panda animation -->

    <div class="panda-area">

        <div class="panda panda-left">
            🐼
        </div>

        <div class="panda panda-right">
            🐼
        </div>

        <div class="hug-heart">
            ❤️
        </div>

    </div>


    <!-- Sorry -->

    <div class="sorry">
        I'm Sorry 🥺❤️
    </div>


    <div class="message">

        Sometimes we fight.
        Sometimes we misunderstand each other.

        <br>

        But our friendship means more
        than one little mistake. 🫶

        <br>

        So... can we start again? 💗

    </div>


    <!-- Button -->

    <button
        class="msg-button"
        onclick="seeMessage()"
    >
        See Ur Msg 💌
    </button>

</div>


<script>

function seeMessage() {

    // Fade out page

    document.body.style.transition =
        "1s";

    document.body.style.opacity =
        "0";

    document.body.style.transform =
        "scale(1.05)";


    // Open page 3

    setTimeout(function() {

        window.location.href =
            "page3.html";

    }, 1000);
}

</script>

</body>
</html>
